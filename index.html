<html>
  <head>
    <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>NyaLIZA</title>
  <style>
    :root {
      --bg-color: #121218;
      --panel-color: #2d333b;
      --text-color: #ffffff;
      --accent-blue: #2f81f7;
      --accent-green: seagreen;
      --border-color: #444c56;
      --shadow: 0 4px 24px 0 rgba(0,0,0,0.15);
    }
    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', 'Meiryo', 'Arial', sans-serif;
      margin: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: left;
      padding: 40px, 40px, 40px, 40px; 
    }
    header {
      width: 100%;
      background: var(--panel-color);
      padding: 32px 0 16px 0;
      box-shadow: var(--shadow);
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    header h1 {
      margin: 32px;
      font-size: 2rem;
      letter-spacing: 2px;
    }
    main {
      flex: 1;
      font-size: 0.75rem;
      width: 100%;
      max-width: 600px;
      margin-top: 40px;
      padding: 32px 24px 24px 24px;
      background: var(--panel-color);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      text-align: left;
    }
    h2 {
      color: var(--accent-blue);
      font-size: 1rem;
      margin-bottom: 0.8em;
    }
    p {
      font-size: 0.75rem;
      line-height: 1.7;
      margin-bottom: 1.5em;
    }
    .btn {
      display: inline-block;
      padding: 0.3em 1em; 
      color: #fff;
      background: var(--accent-green);
      border-radius: 3px;
      border: none;
      font-size: 0.8rem;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: background 0.2s;
      cursor: pointer;
    }
    .btn2 {
      display: inline-block;
      padding: 0.3em 1em; 
      color: #fff;
      background: var(--banel-color);
      border-radius: 3px;
      border: none;
      font-size: 0.8rem;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: background 0.2s;
      cursor: pointer;
    }
    .btn:hover, .btn:focus {
      background: var(--accent-blue);
      outline: none;
    }
    .btn2:hover, .btn2:focus {
      background: var(--accent-blue);
      outline: none;
    }
    
    footer {
      margin-top: 50px;
      color: #888;
      font-size: 0.6em;
      text-align: left;
      opacity: 0.7;
    }
    @media (max-width: 700px) {
      main {
        max-width: 95vw;
        padding: 20px 4vw;
      }
      header {
        padding: 24px 0 12px 0;
      }
    }
  </style>
</head>
<body>

<h1>NyaLIZA</h1>
  </header>

<main>
